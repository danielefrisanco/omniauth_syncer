plugins:
  - rubocop-performance
  - rubocop-rails

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'bin/*'
    - 'vendor/**/*'
    - 'spec/fixtures/**/*'

Layout/LineLength:
  Max: 120

Style/Documentation:
  Enabled: false

Style/ClassAndModuleChildren:
  EnforcedStyle: nested

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Metrics/ClassLength:
  Exclude:
    - 'lib/omniauth_syncer/sync_service.rb'

Metrics/MethodLength:
  Max: 15

Naming/PredicateMethod:
  AllowedMethods:
    - validate!

Rails/ApplicationRecord:
  Exclude:
    - 'spec/**/*'

# Example host-app code: user-facing strings stay inline for readability.
Rails/I18nLocaleTexts:
  Exclude:
    - 'examples/**/*'
